<!--
  Ausschnitt für C:\Program Files (x86)\ossec-agent\ossec.conf auf dem Windows-Client.
  Innerhalb von <ossec_config> ... </ossec_config> einfügen, danach: Restart-Service -Name Wazuh
-->

<!-- Sysmon: Prozessstarts, Netzwerkverbindungen usw. -->
<localfile>
  <location>Microsoft-Windows-Sysmon/Operational</location>
  <log_format>eventchannel</log_format>
</localfile>

<!-- PowerShell: Skriptblockprotokollierung (Ereignis 4104) -->
<localfile>
  <location>Microsoft-Windows-PowerShell/Operational</location>
  <log_format>eventchannel</log_format>
</localfile>

<!-- Microsoft Defender: Erkennungen, z. B. EICAR-Testdatei -->
<localfile>
  <location>Microsoft-Windows-Windows Defender/Operational</location>
  <log_format>eventchannel</log_format>
</localfile>
